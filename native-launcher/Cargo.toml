[package]
name = "acp-teams-adapter"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
[dependencies]
amplifier-native-platform = { git = "https://github.com/microsoft/amplifier-constellation", rev = "b65ed668c7df2ac4df3b15198bf8fb4db44abbec", features = ["local-auth"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"
