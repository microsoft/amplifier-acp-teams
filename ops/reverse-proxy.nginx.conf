# Example only. Replace the hostname, certificate paths and fixed local port.
# No management dashboard or API is available through this public virtual host.
server {
    listen 443 ssl;
    server_name teams-agent.example.com;
    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/private-key.pem;
    client_max_body_size 1m;

    location = /api/messages {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18462;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 35s;
    }
    location ~ ^/(about|privacy|terms)$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18462;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
